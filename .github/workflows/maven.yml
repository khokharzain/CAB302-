name: Java CI

on:
  push:
    branches: [ "bubase-branch" ]
  pull_request:
    branches: [ "bubase-branch" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn --batch-mode --update-snapshots verify